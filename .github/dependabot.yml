version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Roll routine minor and patch bumps into a single PR per week so the
      # review queue stays manageable. Major upgrades and security fixes
      # still come through as their own PRs.
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    # Majors that are blocked upstream (checked Sep 28 2026). Each one failed
    # its Vercel preview; lift the ignore once the blocker ships support.
    ignore:
      # Payload (3.90.2) peer-requires graphql ^16.8.1; 17 fails npm install.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (8.71, via eslint-config-next) supports TS <6.1 and
      # throws "does not support TS 7.0" during lint.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react (7.37.5, via eslint-config-next) supports eslint
      # <=9; eslint 10 crashes it ("getFilename is not a function").
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the Vercel runtime's Node major (24.x); bump it
      # by hand when the project's Node version changes, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"
