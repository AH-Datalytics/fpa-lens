name: Tropical weather ingest

# Feeds /environment/tropical-weather. Polls the National Hurricane Center for
# current storms, cone/track/watch-warning shapefiles, A-deck model guidance and
# the Atlantic tropical weather outlook, normalizes everything to GeoJSON/JSON,
# and uploads it (plus a manifest.json index) to the public tropical Vercel Blob
# store. The page reads that manifest straight from the browser, so no deploy is
# involved and nothing is committed back to the repo.
#
# Unlike the weekly SharePoint refresh, this writes to blob storage only. It is
# triggered by schedule/workflow_dispatch only and consumes no event payload
# data, so there is no untrusted input reaching any run: step.

on:
  schedule:
    # Hourly at :17 -- deliberately off the top and half hour, where GitHub's
    # best-effort scheduler drops and delays events most.
    #
    # COST, not freshness, sets this cadence, and the arithmetic is not obvious:
    # Actions bills each job rounded UP to a whole minute, while this one
    # finishes in ~20s. So making the run faster saves NOTHING -- the only lever
    # is fewer runs. At the previous 4/hour it billed 96 min/day = ~2,880/month,
    # i.e. this single workflow consumed effectively the whole 3,000-minute Team
    # allowance shared by every repo in the org. Hourly is ~720/month.
    #
    # Nothing polled here moves faster than that anyway: advisories every 6h
    # (3h once intermediates are being issued), a-deck cycles and wind
    # probability on the 6-hourly synoptic grid, the outlook 4x/day.
    #
    # Accepted tradeoff: a new advisory can take up to an hour to reach the page,
    # and up to two if the scheduler drops a run. That is visible rather than
    # silent -- the page states the advisory time and warns when data is stale.
    # GOES satellite is the one product with a minutes-scale clock; it now
    # refreshes hourly too, which the controller signed off on.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tropical-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingest
        working-directory: ingest
        env:
          TROPICAL_READ_WRITE_TOKEN: ${{ secrets.TROPICAL_READ_WRITE_TOKEN }}
          TROPICAL_BLOB_BASE_URL: ${{ secrets.TROPICAL_BLOB_BASE_URL }}
        run: python ingest.py
