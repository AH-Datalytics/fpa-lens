name: Weekly data refresh

# Pulls the newest source files from the SharePoint LensRepository, regenerates
# the dashboard JSON in public/data/, commits whatever changed (which triggers a
# Vercel deploy), and emails the data-ops contact if any category fails. Runs
# Fridays; can also be triggered manually. Fully hands-off otherwise.

on:
  schedule:
    - cron: "0 13 * * 5" # Fridays ~07:00-08:00 America/Chicago (UTC, no DST shift)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install openpyxl

      - name: Refresh data from SharePoint
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_HOST: ${{ secrets.SHAREPOINT_HOST }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_LIBRARY: ${{ secrets.SHAREPOINT_LIBRARY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh-data.mjs

      # Email the data-ops contact when a new SITREP advances the dashboard to a
      # new report month. Runs before the commit step so HEAD is still the prior
      # month for the comparison. Self-silences on a same-month re-parse.
      - name: Notify on SITREP roll
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/notify-sitrep-roll.mjs

      # Commit even on partial failure so categories that DID update still publish.
      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "fpa-lens-bot"
          git config user.email "oboochever@ahdatalytics.com"
          git add public/data src/data/turfCycles.json
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore: weekly data refresh [skip ci]"
            git push
          fi

      # Email the data-ops contact if anything failed.
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-failure.mjs
