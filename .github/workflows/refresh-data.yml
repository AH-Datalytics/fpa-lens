name: Weekly data refresh

# Pulls the newest source files from the SharePoint LensRepository, regenerates
# the dashboard JSON in public/data/, and commits any changes (which triggers a
# Vercel deploy). Runs Fridays; can also be triggered manually.
#
# A failed scheduled run emails the user who last edited this cron (GitHub's
# built-in notification), so silent staleness is avoided.

on:
  schedule:
    - cron: "0 13 * * 5" # Fridays ~07:00-08:00 America/Chicago (UTC, no DST shift)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install openpyxl

      - name: Refresh data from SharePoint
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_HOST: ${{ secrets.SHAREPOINT_HOST }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_LIBRARY: ${{ secrets.SHAREPOINT_LIBRARY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh-data.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "fpa-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore: weekly data refresh [skip ci]"
            git push
          fi
